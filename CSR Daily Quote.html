<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSR Daily Inspiration</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #0f1f3d;
      --navy-mid:   #1a3260;
      --blue:       #1e4db7;
      --blue-light: #2e6be6;
      --accent:     #3b9eff;
      --white:      #ffffff;
      --grey-400:   #8fa3c0;
      --grey-600:   #4e6180;
    }

    html, body {
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, var(--navy) 0%, var(--navy-mid) 55%, #1a3a7a 100%);
      color: var(--white);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 72% 10%, rgba(255,255,255,.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,.20) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 55%, rgba(255,255,255,.30) 0%, transparent 100%),
        radial-gradient(2px 2px at 60% 35%, rgba(59,158,255,.40) 0%, transparent 100%),
        radial-gradient(2px 2px at 25% 50%, rgba(59,158,255,.30) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2.5rem 1.25rem 3rem;
    }

    header { text-align: center; margin-bottom: 2.5rem; animation: fadeDown .7s ease both; }

    .badge {
      display: inline-flex; align-items: center; gap: .45rem;
      background: rgba(59,158,255,.15); border: 1px solid rgba(59,158,255,.35);
      border-radius: 99px; padding: .35rem .9rem;
      font-size: .72rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 1rem;
    }

    .badge-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); animation: pulse 2s infinite;
    }

    h1 {
      font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 800;
      letter-spacing: -.02em; line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .subtitle { margin-top: .6rem; font-size: .97rem; color: var(--grey-400); }

    .card {
      width: 100%; max-width: 720px;
      background: rgba(255,255,255,.06); backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,.12);
      border-radius: 1.5rem; padding: 2.5rem 2.75rem;
      box-shadow: 0 24px 60px rgba(0,0,0,.45); animation: fadeUp .8s ease .1s both;
    }

    .date-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; flex-wrap: wrap; gap: .75rem; }
    .date-chip { display: flex; align-items: center; gap: .5rem; font-size: .82rem; color: var(--grey-400); }

    .selector-label { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--grey-400); margin-bottom: .5rem; }
    .select-wrap { position: relative; margin-bottom: 1.75rem; }

    select {
      width: 100%; appearance: none; -webkit-appearance: none;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
      border-radius: .75rem; color: var(--white); font-size: .97rem; font-family: inherit;
      padding: .85rem 3rem .85rem 1.1rem; cursor: pointer;
      transition: border-color .2s, background .2s; outline: none;
    }
    select:hover { border-color: rgba(59,158,255,.5); }
    select:focus  { border-color: var(--accent); background: rgba(59,158,255,.1); }
    select option { background: #1a3260; color: var(--white); }

    .select-arrow { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--grey-400); }

    .btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: .6rem;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-light) 100%);
      border: none; border-radius: .75rem; color: var(--white);
      font-size: 1rem; font-weight: 700; font-family: inherit; padding: .95rem 1.5rem;
      cursor: pointer; transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(30,77,183,.5); margin-bottom: 2rem;
    }
    .btn:hover { opacity: .92; transform: translateY(-1px); box-shadow: 0 8px 28px rgba(30,77,183,.65); }
    .btn:active { transform: translateY(0); }

    .divider { height: 1px; background: rgba(255,255,255,.08); margin-bottom: 2rem; }

    .quote-area { min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .empty-state { text-align: center; color: var(--grey-400); }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: .85rem; opacity: .4; }
    .empty-state p { font-size: .92rem; line-height: 1.6; }

    .quote-display { width: 100%; animation: fadeUp .5s ease both; }
    .quote-mark { font-size: 5rem; line-height: .55; color: var(--accent); opacity: .3; font-family: Georgia, serif; display: block; margin-bottom: .5rem; }
    .quote-text { font-size: clamp(1.1rem, 2.5vw, 1.4rem); font-weight: 400; line-height: 1.7; color: var(--white); font-style: italic; margin-bottom: 1.75rem; }

    .attribution { display: flex; align-items: flex-start; gap: 1rem; padding-top: 1.25rem; border-top: 1px solid rgba(255,255,255,.1); }
    .avatar { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--accent)); display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 700; }
    .attr-name  { font-weight: 700; font-size: .97rem; }
    .attr-role  { font-size: .8rem; color: var(--accent); margin-top: .15rem; }
    .attr-context { margin-top: .6rem; font-size: .83rem; color: var(--grey-400); line-height: 1.55; }

    .field-tag { display: inline-flex; align-items: center; gap: .35rem; margin-top: 1.25rem; background: rgba(59,158,255,.12); border: 1px solid rgba(59,158,255,.25); border-radius: 99px; padding: .3rem .8rem; font-size: .72rem; color: var(--accent); font-weight: 700; letter-spacing: .04em; }

    footer { margin-top: 2.5rem; font-size: .75rem; color: var(--grey-600); text-align: center; animation: fadeUp .9s ease .3s both; }

    @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp   { from { opacity: 0; transform: translateY(16px);  } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse    { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    @media (max-width: 500px) { .card { padding: 1.75rem 1.4rem; } .attribution { flex-direction: column; } }
  </style>
</head>
<body>
<div class="page">

  <header>
    <div class="badge"><div class="badge-dot"></div>Daily Inspiration</div>
    <h1>CSR Daily Quote</h1>
    <p class="subtitle">Purpose-driven wisdom for changemakers</p>
  </header>

  <div class="card">
    <div class="date-row">
      <div class="date-chip">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        <span id="todayDate"></span>
      </div>
    </div>

    <div class="selector-label">Your CSR Focus Area</div>
    <div class="select-wrap">
      <select id="csrField">
        <option>ESG (Environmental, Social &amp; Governance)</option>
        <option>Corporate Philanthropy</option>
        <option>Employee Volunteerism</option>
        <option>Impact Investing</option>
        <option>Nonprofit Management</option>
        <option>Sustainability &amp; Climate Action</option>
        <option>Diversity, Equity &amp; Inclusion</option>
        <option>Community Development</option>
        <option>Social Enterprise</option>
        <option>Stakeholder Engagement</option>
        <option>Human Rights &amp; Business Ethics</option>
        <option>Circular Economy</option>
        <option>Responsible Supply Chain</option>
        <option>Corporate Governance &amp; Ethics</option>
        <option>B Corp &amp; Purpose-Driven Business</option>
      </select>
      <div class="select-arrow">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </div>
    </div>

    <button class="btn" onclick="showQuote()">
      <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m8.66-9h-1M4.34 12h-1m15-6.36-.71.71M5.37 18.63l-.71.71M18.63 18.63l-.71-.71M5.37 5.37l-.71-.71M12 7a5 5 0 100 10A5 5 0 0012 7z"/>
      </svg>
      Get Today's Inspiration
    </button>

    <div class="divider"></div>

    <div class="quote-area" id="quoteArea">
      <div class="empty-state">
        <div class="icon">✦</div>
        <p>Select your CSR focus area above<br>and click the button to receive your daily quote.</p>
      </div>
    </div>
  </div>

  <footer>Built for CSR &amp; Purpose-Driven Professionals</footer>
</div>

<script>
  const QUOTES = {
    "ESG (Environmental, Social & Governance)": [
      { quote: "ESG is not a constraint on returns — it is a lens for identifying companies that will be winners in the long run.", author: "Larry Fink", role: "CEO, BlackRock", context: "His annual letters to CEOs have reshaped how Wall Street thinks about long-term value and accountability." },
      { quote: "Companies that don't adapt to a world that demands sustainability will find themselves on the wrong side of history.", author: "Paul Polman", role: "Former CEO, Unilever", context: "Polman linked Unilever's commercial success directly to its positive social and environmental impact." },
      { quote: "The E, the S, and the G are inseparable. You cannot fix the climate without fixing inequality.", author: "Mindy Lubber", role: "CEO, Ceres", context: "Ceres drives corporate leadership on environmental and social challenges through investor power." },
      { quote: "Sustainable business is not about sacrifice. It's about redesigning business models so that doing good and doing well become the same thing.", author: "John Elkington", role: "Author & Sustainability Pioneer", context: "Elkington coined the Triple Bottom Line — People, Planet, Profit — that underpins modern ESG thinking." },
      { quote: "ESG without accountability is just storytelling. The metrics must mean something.", author: "Tensie Whelan", role: "Director, NYU Stern Center for Sustainable Business", context: "Her research demonstrates the financial materiality of sustainability, moving ESG from ideology to evidence." },
      { quote: "Investors who ignore ESG risks are not being prudent — they are being negligent.", author: "Mark Carney", role: "Former Governor, Bank of England", context: "Carney was instrumental in making climate risk a mainstream financial concern for global regulators." },
      { quote: "The goal is not to be a sustainable company. The goal is to be a company that sustains the world.", author: "Yvon Chouinard", role: "Founder, Patagonia", context: "Chouinard's decision to transfer Patagonia's ownership to fight climate change is one of the boldest acts in business history." }
    ],
    "Corporate Philanthropy": [
      { quote: "No one has ever become poor by giving.", author: "Anne Frank", role: "Diarist & Holocaust Victim", context: "A timeless reminder that generosity enriches both giver and receiver, even in the darkest of circumstances." },
      { quote: "It's not how much we give but how much love we put into giving.", author: "Mother Teresa", role: "Founder, Missionaries of Charity", context: "Her life's work redefined what corporate and personal philanthropy should feel at its core — deeply human." },
      { quote: "The best philanthropy is not writing a check. It's deploying your full asset base in service of a cause.", author: "Darren Walker", role: "President, Ford Foundation", context: "Walker is one of the most influential voices reshaping how foundations and corporations approach giving." },
      { quote: "Giving money is easy. Giving wisely is the real work.", author: "Melinda French Gates", role: "Philanthropist & Co-founder, Bill & Melinda Gates Foundation", context: "She has spent decades building evidence-based philanthropic strategies at a global scale." },
      { quote: "Philanthropy is not charity. Charity relieves the symptoms. Philanthropy attacks the root causes.", author: "Peter Buffett", role: "Philanthropist & Author", context: "As Warren Buffett's son, Peter has spent years questioning and reimagining what it means to give effectively." },
      { quote: "The companies that give back grow back. There is no more powerful marketing than a generous soul.", author: "Marc Benioff", role: "CEO, Salesforce", context: "Salesforce's 1-1-1 model — 1% equity, 1% product, 1% employee time — became a blueprint for tech philanthropy." },
      { quote: "We make a living by what we get. We make a life by what we give.", author: "Winston Churchill", role: "Former Prime Minister, United Kingdom", context: "A classic call to service that remains at the heart of every great corporate giving philosophy." }
    ],
    "Employee Volunteerism": [
      { quote: "Volunteers do not necessarily have the time; they just have the heart.", author: "Elizabeth Andrew", role: "Author & Theologian", context: "A reminder that the most powerful currency in volunteerism is not hours — it's commitment." },
      { quote: "When employees volunteer, they don't just give — they grow. The company that enables this gets back far more than it gives.", author: "Liz Maw", role: "Former CEO, Net Impact", context: "Net Impact has engaged hundreds of thousands of professionals in using their skills for social good." },
      { quote: "Service to others is the rent you pay for your room here on Earth.", author: "Muhammad Ali", role: "World Champion Boxer & Humanitarian", context: "Ali's legacy of civic commitment reminds us that greatness is defined by what we give, not what we win." },
      { quote: "Skills-based volunteering is a force multiplier. An hour of expertise can do the work of ten hours of unskilled effort.", author: "Deloitte Insights", role: "Global Research", context: "Skills-based volunteering is fast becoming the standard for how corporations engage their talent in the community." },
      { quote: "The best employee engagement program you will ever launch is the one that lets your people do good.", author: "Amy Hutcheson", role: "Corporate Volunteerism Consultant", context: "Research consistently shows that volunteer programs are among the top drivers of employee retention and pride." },
      { quote: "I slept and dreamt that life was joy. I awoke and saw that life was service. I acted and behold, service was joy.", author: "Rabindranath Tagore", role: "Nobel Laureate in Literature", context: "Tagore's words capture why the most fulfilled employees are often those who serve their communities." },
      { quote: "Volunteering is the ultimate exercise in democracy. You vote in elections once a year, but when you volunteer, you vote every day about the kind of community you want to live in.", author: "Marjorie Moore", role: "Volunteerism Advocate", context: "This perspective elevates corporate volunteer programs from nice-to-have perks to acts of civic leadership." }
    ],
    "Impact Investing": [
      { quote: "Impact investing is not a trade-off between financial return and social good. When done right, it is the highest form of both.", author: "Sir Ronald Cohen", role: "Chairman, Global Steering Group for Impact Investment", context: "Cohen has spent decades building the global infrastructure for impact investing and the measurement of social outcomes." },
      { quote: "Capital is not scarce. What is scarce is capital directed wisely toward human flourishing.", author: "Jacqueline Novogratz", role: "Founder & CEO, Acumen", context: "Acumen pioneered patient capital — investing in social enterprises serving the world's poorest people." },
      { quote: "Every dollar is a vote for the world you want to live in.", author: "Anna Lappe", role: "Author & Food Systems Advocate", context: "A simple truth that investors, fund managers, and everyday people alike can act on today." },
      { quote: "The question is no longer whether to integrate ESG into investing — it's how fast and how deep.", author: "Fiona Reynolds", role: "Former CEO, Principles for Responsible Investment", context: "PRI represents over $120 trillion in assets under management committed to responsible investment." },
      { quote: "Impact is not accidental. It requires intentionality, measurement, and the courage to report what isn't working.", author: "Brian Trelstad", role: "Partner, Bridges Fund Management", context: "Trelstad is a leading practitioner in social impact measurement and management." },
      { quote: "We need markets that are not just efficient but just.", author: "Mariana Mazzucato", role: "Professor, UCL Institute for Innovation & Public Purpose", context: "Her work challenges the assumption that markets alone can solve society's greatest challenges." },
      { quote: "The most powerful force in the universe is compound interest working for human dignity.", author: "Muhammad Yunus", role: "Nobel Peace Laureate & Founder, Grameen Bank", context: "Yunus pioneered microfinance, proving that investing in the poor yields returns no spreadsheet can fully capture." }
    ],
    "Nonprofit Management": [
      { quote: "A nonprofit is not defined by what it doesn't do with profit. It is defined by what it does with purpose.", author: "Dan Pallotta", role: "Author, Uncharitable", context: "Pallotta's TED Talk on the way we think about charity sparked a global debate on overhead, ambition, and scale." },
      { quote: "Great nonprofits don't just serve their mission — they build organizations capable of sustaining and expanding it for generations.", author: "Jim Collins", role: "Author, Good to Great", context: "Collins adapted his landmark business research to show how nonprofit excellence is built on discipline, not resources." },
      { quote: "The most dangerous phrase in any organization is: We've always done it this way.", author: "Grace Hopper", role: "Computer Science Pioneer & U.S. Navy Rear Admiral", context: "Innovation is as vital in the social sector as in any industry — stagnation is mission risk." },
      { quote: "You can't go out and solve the world's problems without a strong foundation of leadership, governance, and financial integrity.", author: "Frances Hesselbein", role: "Former CEO, Girl Scouts of the USA", context: "Hesselbein transformed the Girl Scouts into a management model studied at Harvard and West Point alike." },
      { quote: "Collaboration over competition. Abundance over scarcity. We are not in this alone.", author: "Vu Le", role: "Author, Nonprofit AF", context: "Vu Le's blog has built a community of nonprofit leaders committed to equity and humor." },
      { quote: "The measure of a nonprofit's success is not the size of its budget but the depth of its impact.", author: "Mario Morino", role: "Co-founder, Venture Philanthropy Partners", context: "Morino pioneered the application of venture capital discipline to social sector investment and outcomes." },
      { quote: "People join nonprofits for the mission. They stay — or leave — because of the culture.", author: "Beth Kanter", role: "Author & Nonprofit Innovation Consultant", context: "Kanter has helped thousands of nonprofits build resilient, human-centered organizational cultures." }
    ],
    "Sustainability & Climate Action": [
      { quote: "We are the first generation to feel the effect of climate change and the last generation that can do something about it.", author: "Barack Obama", role: "44th President of the United States", context: "Spoken at the 2014 UN Climate Summit, this quote remains a defining call to corporate and civic action." },
      { quote: "There is no Planet B.", author: "Ban Ki-moon", role: "Former UN Secretary-General", context: "A simple, devastating truth that anchors why sustainability is not optional for any business on this planet." },
      { quote: "The Earth does not belong to us. We belong to the Earth.", author: "Chief Seattle", role: "Suquamish & Duwamish Chief", context: "Indigenous wisdom that corporate sustainability leaders increasingly cite as the philosophical foundation of their work." },
      { quote: "In every walk with nature, one receives far more than one seeks.", author: "John Muir", role: "Naturalist & Conservationist", context: "Muir's lifelong advocacy for wild places seeded the conservation movement that sustainability is built upon today." },
      { quote: "Climate change is not an environmental issue. It is a business issue, a human rights issue, and the defining issue of our era.", author: "Christiana Figueres", role: "Former Executive Secretary, UN Framework Convention on Climate Change", context: "Figueres led the historic Paris Agreement negotiations — widely considered the most significant climate deal ever struck." },
      { quote: "We don't need a handful of people doing sustainability perfectly. We need millions of people doing it imperfectly.", author: "Anne-Marie Bonneau", role: "Zero-Waste Chef & Author", context: "A reminder that progress at scale matters more than perfection in isolation — for companies and individuals alike." },
      { quote: "The stone age didn't end because we ran out of stone. It ended because we found something better. The fossil fuel age will end the same way.", author: "Sheikh Ahmed Zaki Yamani", role: "Former Saudi Oil Minister", context: "A striking reminder from within the fossil fuel industry itself that energy transition is inevitable." }
    ],
    "Diversity, Equity & Inclusion": [
      { quote: "Diversity is being invited to the party. Inclusion is being asked to dance.", author: "Verna Myers", role: "VP Inclusion Strategy, Netflix", context: "Myers's elegant distinction has become the most widely cited framework in corporate DEI work worldwide." },
      { quote: "If you have come here to help me, you are wasting your time. But if you have come because your liberation is bound up with mine, then let us work together.", author: "Lilla Watson", role: "Aboriginal Educator & Activist", context: "This quote reframes DEI from charity to solidarity — from programs to transformation." },
      { quote: "Until all of us have made it, none of us have made it.", author: "Rosemary Brown", role: "First Black Canadian Woman Elected to a Provincial Legislature", context: "A call to collective accountability that every DEI leader should carry into every boardroom conversation." },
      { quote: "In diversity there is beauty and there is strength.", author: "Maya Angelou", role: "Poet, Author & Civil Rights Activist", context: "Angelou's voice has inspired generations to see difference not as a problem to be managed but a gift to be celebrated." },
      { quote: "Equity is not about giving everyone the same thing. It is about giving everyone what they need to thrive.", author: "Ibram X. Kendi", role: "Author, How to Be an Antiracist", context: "Kendi's work distinguishes between equality and equity — a distinction essential to effective corporate DEI strategy." },
      { quote: "The most common way people give up their power is by thinking they don't have any.", author: "Alice Walker", role: "Author & Activist", context: "A reminder to DEI professionals that every employee, at every level, has the power to shift culture." },
      { quote: "We cannot all succeed when half of us are held back.", author: "Malala Yousafzai", role: "Nobel Peace Laureate", context: "Malala's fight for education equality is a living example of why DEI is inseparable from human progress." }
    ],
    "Community Development": [
      { quote: "Alone we can do so little; together we can do so much.", author: "Helen Keller", role: "Author, Activist & Lecturer", context: "A foundational truth for every community development professional who knows that lasting change is never built alone." },
      { quote: "If you want to go fast, go alone. If you want to go far, go together.", author: "African Proverb", role: "Traditional Wisdom", context: "The oldest and truest insight in community organizing — still the bedrock of every effective place-based initiative." },
      { quote: "Community is not a place. It's a practice.", author: "adrienne maree brown", role: "Author, Emergent Strategy", context: "Brown's work on emergence and collective transformation is reshaping how organizers and corporate partners think about community." },
      { quote: "Real change, enduring change, happens one step at a time.", author: "Ruth Bader Ginsburg", role: "Associate Justice, U.S. Supreme Court", context: "RBG's patient, strategic approach to justice is a masterclass in how community change actually unfolds." },
      { quote: "Never doubt that a small group of thoughtful, committed citizens can change the world. Indeed, it is the only thing that ever has.", author: "Margaret Mead", role: "Cultural Anthropologist", context: "The most quoted call to action in community organizing — and after a century, still the most accurate." },
      { quote: "Corporate investment in communities works best when the community leads and the company follows.", author: "Michael Rubinger", role: "Former CEO, Local Initiatives Support Corporation", context: "LISC has invested over $26 billion in low-income communities — built on the principle of community-driven development." },
      { quote: "The strength of a community is not measured by its wealthiest members but by how it treats its most vulnerable.", author: "Franklin D. Roosevelt", role: "32nd President of the United States", context: "A measure that should sit at the center of every corporate community investment strategy." }
    ],
    "Social Enterprise": [
      { quote: "Business can be a powerful platform for social change — if leaders have the courage to use it that way.", author: "Howard Schultz", role: "Former CEO, Starbucks", context: "Schultz built Starbucks into a company known for benefits, racial equity programs, and refugee hiring at scale." },
      { quote: "The most powerful force for economic inclusion is an entrepreneur who refuses to leave their community behind.", author: "Muhammad Yunus", role: "Nobel Peace Laureate & Father of Social Business", context: "Yunus's concept of social business — zero-profit, maximum-impact — has spawned thousands of enterprises worldwide." },
      { quote: "Social enterprise is not a compromise between profit and purpose — it is proof that they were never opposites.", author: "Heerad Sabeti", role: "Co-founder, Fourth Sector Network", context: "Sabeti's fourth sector framework argues for a new class of organization that is both mission-driven and market-engaged." },
      { quote: "If your business doesn't make the world a little better, what exactly is the point?", author: "Blake Mycoskie", role: "Founder, TOMS", context: "TOMS's one-for-one model popularized the idea that every purchase could be an act of social change." },
      { quote: "The next great wave of innovation will not come from Silicon Valley. It will come from social entrepreneurs solving real problems for real people.", author: "Bill Drayton", role: "Founder, Ashoka", context: "Drayton built Ashoka into the world's largest network of social entrepreneurs, spanning 93 countries." },
      { quote: "Social enterprise succeeds when it treats the people it serves as customers, not beneficiaries.", author: "Jacqueline Novogratz", role: "Founder & CEO, Acumen", context: "Acumen's investment in dignity-driven enterprises has influenced an entire generation of social business leaders." },
      { quote: "Profit is the applause you get for taking care of your customers and creating a motivated team.", author: "Ken Blanchard", role: "Author, The One Minute Manager", context: "For social enterprises, impact is the applause you earn for getting the mission right." }

  function getDailyIndex(field, total) {
    const d = new Date();
    const seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate() + field.length;
    return seed % total;
  }

  function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function initials(name) {
    return (name||'?').split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  }

  function normalise(str) {
    const el = document.createElement('textarea');
    el.innerHTML = str;
    return el.value;
  }

  function showQuote() {
    const rawField = document.getElementById('csrField').value;
    const field = normalise(rawField);
    const pool = QUOTES[field];
    if (!pool) return;
    const data = pool[getDailyIndex(field, pool.length)];
    document.getElementById('quoteArea').innerHTML = `
      <div class="quote-display">
        <span class="quote-mark">&ldquo;</span>
        <p class="quote-text">${esc(data.quote)}</p>
        <div class="attribution">
          <div class="avatar">${initials(data.author)}</div>
          <div>
            <div class="attr-name">${esc(data.author)}</div>
            <div class="attr-role">${esc(data.role)}</div>
            <div class="attr-context">${esc(data.context)}</div>
          </div>
        </div>
        <div class="field-tag">&#9670; ${esc(field)}</div>
      </div>`;
  }

  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  window.addEventListener('DOMContentLoaded', () => {
    const sel = document.getElementById('csrField');
    const saved = localStorage.getItem('csr_last_field');
    if (saved) {
      for (let o of sel.options) { if (normalise(o.value) === saved) { o.selected = true; break; } }
    }
    sel.addEventListener('change', () => { localStorage.setItem('csr_last_field', normalise(sel.value)); });
  });
</script>
